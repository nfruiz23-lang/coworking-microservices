services:
  # ==========================================
  # 1. CATALOG SERVICE (FastAPI)
  # ==========================================
  - type: web
    name: catalog-service
    runtime: docker
    dockerContext: ./catalog-service
    dockerfilePath: ./catalog-service/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ORDERS_SERVICE_URL
        fromService:
          type: web
          name: orders-service
          property: host

  # ==========================================
  # 2. ORDERS SERVICE (FastAPI)
  # ==========================================
  - type: web
    name: orders-service
    runtime: docker
    dockerContext: ./orders-service
    dockerfilePath: ./orders-service/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CATALOG_SERVICE_URL
        fromService:
          type: web
          name: catalog-service
          property: host
